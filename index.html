<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MOBA — Viewport Prototype</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    [hidden] { display: none !important; }

    #launch {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #ffffff;
    }

    #start-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 62px;
      padding: 17px 24px;
      border: 0;
      border-radius: 14px;
      background: #252525;
      color: #ffffff;
      font: inherit;
      font-size: 16px;
      font-weight: 650;
      line-height: 1.2;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #start-button:focus-visible {
      outline: 3px solid #6f9cff;
      outline-offset: 4px;
    }

    #start-button svg {
      display: block;
      width: 24px;
      height: 24px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #game {
      position: fixed;
      inset: 0;
      display: flex;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: #ffffff;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .control-zone {
      flex: 0 0 25%;
      min-width: 0;
      height: 100%;
      background: #d4d4d4;
    }

    .arena {
      flex: 1 1 50%;
      min-width: 0;
      height: 100%;
      background: #ffffff;
    }

    /* If the browser cannot lock to landscape, keep the game itself landscape. */
    @media (orientation: portrait) {
      #game {
        inset: auto;
        top: 50%;
        left: 50%;
        width: 100vh;
        width: 100dvh;
        height: 100vw;
        height: 100dvw;
        transform: translate(-50%, -50%) rotate(90deg);
        transform-origin: center;
      }
    }
  </style>
</head>
<body>
  <main id="launch">
    <button id="start-button" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
      <span>Enter Fullscreen &amp; Start</span>
    </button>
  </main>

  <div id="game" aria-label="Landscape game screen" hidden>
    <section class="control-zone" aria-label="Left controls"></section>
    <main class="arena" aria-label="Game area"></main>
    <section class="control-zone" aria-label="Right controls"></section>
  </div>

  <script>
    "use strict";

    const launch = document.getElementById("launch");
    const game = document.getElementById("game");
    const startButton = document.getElementById("start-button");

    startButton.addEventListener("click", async () => {
      // Enter the game immediately, including on browsers without fullscreen support.
      launch.hidden = true;
      game.hidden = false;

      // Fullscreen must be requested during a user-initiated interaction.
      try {
        if (document.fullscreenEnabled && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        console.info("Fullscreen unavailable; using viewport fallback.", error);
      }

      // Android browsers may allow landscape locking while in fullscreen.
      // iPhone Safari currently requires the CSS-rotation fallback above.
      try {
        if (screen.orientation && typeof screen.orientation.lock === "function") {
          await screen.orientation.lock("landscape");
        }
      } catch (error) {
        console.info("Orientation lock unavailable; using landscape layout.", error);
      }
    }, { once: true });
  </script>
</body>
</html>
